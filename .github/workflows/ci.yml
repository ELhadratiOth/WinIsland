name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build EXEs
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build winisland.exe, winisland-settings.exe and winisland-setup.exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\make-setup.ps1 -Jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: winisland-exe
          path: dist/
          if-no-files-found: error

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        shell: pwsh
        run: |
          cargo test --workspace --profile quick --no-fail-fast 2>&1 | Tee-Object -FilePath test-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The failing tests' names, then each one with the first lines of its panic (GitHub keeps
            # 10 error annotations per step).
            $text = Get-Content test-output.txt -Raw
            $names = [regex]::Matches($text, '(?m)^    (\S+)$') | ForEach-Object { $_.Groups[1].Value }
            Write-Output "::error title=failing tests::$($names -join ', ')"
            $blocks = [regex]::Matches($text, '(?ms)^---- (\S+) stdout ----\r?\n(.*?)(?=^---- |^failures:)')
            foreach ($b in $blocks) {
              $title = $b.Groups[1].Value -replace ':', '%3A' -replace ',', '%2C'
              $msg = ($b.Groups[2].Value -split "`n" | Select-Object -First 6) -join ' | '
              $msg = $msg -replace '%', '%25' -replace "`r", ''
              Write-Output "::error title=$title::$msg"
            }
            exit $code
          }
      - name: Push the test output to ci-tests
        if: ${{ failure() }}
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir out && cp test-output.txt out/ && cd out
          git init -q
          git checkout -q -b ci-tests
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Test output"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-tests
