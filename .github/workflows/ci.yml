name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests + platform build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test tests/WinIsland.Core.Tests -c Release
      - name: Build Windows platform layer
        run: dotnet build src/WinIsland.Platform.Windows -c Release

  windows:
    name: WinUI app (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test tests/WinIsland.Core.Tests -c Release
      - name: Build app
        run: dotnet build src/WinIsland.App -c Release -p:Platform=x64
      - name: Smoke test (launch the real app)
        shell: pwsh
        run: |
          $exe = Resolve-Path 'src/WinIsland.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/WinIsland.exe'
          $log = Join-Path $env:LOCALAPPDATA 'WinIsland\winisland.log'
          New-Item -ItemType Directory -Force smoke | Out-Null
          Remove-Item $log -ErrorAction SilentlyContinue

          $process = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          $alive = -not $process.HasExited

          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$PWD/smoke/screen.png")
          } catch { Write-Warning "Screenshot failed: $_" }

          if ($alive) { Stop-Process -Id $process.Id -Force }
          if (Test-Path $log) { Copy-Item $log smoke/winisland.log; Get-Content $log } else { Write-Warning 'No log written' }

          $failed = -not $alive -or -not (Test-Path $log) -or
                    (Select-String -Path $log -Pattern ' ERR ' -Quiet) -or
                    -not (Select-String -Path $log -Pattern 'Showing island' -Quiet)
          if ($failed) { throw "Smoke test failed (process alive: $alive)" }

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WinIsland-win-x64
          path: src/WinIsland.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/
          if-no-files-found: error
