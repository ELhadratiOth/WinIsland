name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests + platform build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test tests/WinIsland.Core.Tests -c Release
      - name: Build Windows platform layer
        run: dotnet build src/WinIsland.Platform.Windows -c Release

  windows:
    name: WinUI app (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test tests/WinIsland.Core.Tests -c Release
      - name: Build app
        run: dotnet build src/WinIsland.App -c Release -p:Platform=x64
      - name: Smoke test (launch the real app, build and published layouts)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'WinIsland\winisland.log'

          function Test-Island([string] $name, [string] $dir) {
            Write-Host "===== $name ($dir)"
            Get-ChildItem $dir -Recurse -Include *.pri, *.xbf | ForEach-Object { Write-Host "  $($_.FullName.Substring($dir.Length)) $($_.Length)" }
            Remove-Item $log -ErrorAction SilentlyContinue
            $process = Start-Process (Join-Path $dir 'WinIsland.exe') -PassThru
            Start-Sleep -Seconds 12
            $alive = -not $process.HasExited
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save("$PWD/smoke/$name.png")
            } catch { Write-Warning "Screenshot failed: $_" }
            Get-Process WinIsland -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 1
            if (Test-Path $log) { Copy-Item $log "smoke/$name.log"; Get-Content $log | Write-Host } else { Write-Warning 'No log written' }
            $ok = $alive -and (Test-Path $log) -and
                  -not (Select-String -Path $log -Pattern ' ERR ' -Quiet) -and
                  (Select-String -Path $log -Pattern 'Showing island' -Quiet)
            Write-Host "===== ${name}: $(if ($ok) { 'PASS' } else { 'FAIL' })"
            return $ok
          }

          # Exactly what the release workflow ships.
          dotnet publish src/WinIsland.App -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish/release
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          # Same, without ReadyToRun, to isolate the cause if the release layout fails.
          dotnet publish src/WinIsland.App -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:PublishReadyToRun=false -o publish/noR2R
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }

          $results = [ordered]@{
            build   = Test-Island 'build' (Resolve-Path 'src/WinIsland.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64').Path
            release = Test-Island 'release' (Resolve-Path 'publish/release').Path
            noR2R   = Test-Island 'noR2R' (Resolve-Path 'publish/noR2R').Path
          }
          $results | Format-Table | Out-String | Write-Host
          if ($results.Values -contains $false) { throw 'Smoke test failed' }

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WinIsland-win-x64
          path: src/WinIsland.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/
          if-no-files-found: error
