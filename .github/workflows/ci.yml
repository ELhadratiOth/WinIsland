name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests + platform build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test tests/WinIsland.Core.Tests -c Release
      - name: Build Windows platform layer
        run: dotnet build src/WinIsland.Platform.Windows -c Release

  windows:
    name: WinUI app (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test tests/WinIsland.Core.Tests -c Release
      - name: Build app
        run: dotnet build src/WinIsland.App -c Release -p:Platform=x64
      - name: Smoke test (launch the real app, build and published layouts)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'WinIsland\winisland.log'

          function Test-Island([string] $name, [string] $dir) {
            Write-Host "===== $name ($dir)"
            Get-ChildItem $dir -Recurse -Include *.pri, *.xbf | ForEach-Object { Write-Host "  $($_.FullName.Substring($dir.Length)) $($_.Length)" }
            Remove-Item $log -ErrorAction SilentlyContinue
            $process = Start-Process (Join-Path $dir 'WinIsland.exe') -PassThru
            Start-Sleep -Seconds 12
            $alive = -not $process.HasExited
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save("$PWD/smoke/$name.png")
            } catch { Write-Warning "Screenshot failed: $_" }
            Get-Process WinIsland -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 1
            if (Test-Path $log) { Copy-Item $log "smoke/$name.log"; Get-Content $log | Write-Host } else { Write-Warning 'No log written' }
            $ok = $alive -and (Test-Path $log) -and
                  -not (Select-String -Path $log -Pattern ' ERR ' -Quiet) -and
                  (Select-String -Path $log -Pattern 'Showing island' -Quiet)
            Write-Host "===== ${name}: $(if ($ok) { 'PASS' } else { 'FAIL' })"
            return $ok
          }

          # Exactly what the release workflow ships.
          dotnet publish src/WinIsland.App -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish/release
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          # Same, without ReadyToRun, to isolate the cause if the release layout fails.
          dotnet publish src/WinIsland.App -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:PublishReadyToRun=false -o publish/noR2R
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }

          $results = [ordered]@{
            build   = Test-Island 'build' (Resolve-Path 'src/WinIsland.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64').Path
            release = Test-Island 'release' (Resolve-Path 'publish/release').Path
            noR2R   = Test-Island 'noR2R' (Resolve-Path 'publish/noR2R').Path
          }
          $results | Format-Table | Out-String | Write-Host
          if ($results.Values -contains $false) { throw 'Smoke test failed' }

      - name: Visual capture (window configurations)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force visual | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $exe = Resolve-Path 'publish/release/WinIsland.exe'
          $log = Join-Path $env:LOCALAPPDATA 'WinIsland\winisland.log'

          function Save-Island([string] $name) {
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $full = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($full).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $full.Save("$PWD/visual/$name-full.png")
            # Top-centre region, zoomed 3x with nearest-neighbour so individual pixels are visible.
            $w = 560; $h = 220; $x = [int](($screen.Width - $w) / 2)
            $zoom = New-Object System.Drawing.Bitmap ($w * 3), ($h * 3)
            $g = [System.Drawing.Graphics]::FromImage($zoom)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::NearestNeighbor
            $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::Half
            $g.DrawImage($full, (New-Object System.Drawing.Rectangle 0, 0, ($w * 3), ($h * 3)), (New-Object System.Drawing.Rectangle $x, 0, $w, $h), [System.Drawing.GraphicsUnit]::Pixel)
            $zoom.Save("$PWD/visual/$name-zoom.png")
          }

          $variants = [ordered]@{ 'default' = '' }
          foreach ($name in $variants.Keys) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $env:WINISLAND_EXPERIMENT = $variants[$name]
            $process = Start-Process $exe -PassThru
            Start-Sleep -Seconds 5
            Save-Island $name
            Get-Process WinIsland -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 1
            if (Test-Path $log) { Copy-Item $log "visual/$name.log" }
            Write-Host "captured $name"
          }
          $env:WINISLAND_EXPERIMENT = ''

          # Design review: the --preview tour, photographed at each state (see PreviewScenario).
          Remove-Item $log -ErrorAction SilentlyContinue
          $start = Get-Date
          $process = Start-Process $exe -ArgumentList '--preview' -PassThru
          $shots = [ordered]@{ '1-claude-compact' = 3.0; '2-track-notice' = 5.5; '3-media-compact' = 8.5; '4-media-expanded' = 11.0; '5-claude-panel' = 14.0; '6-clock-expanded' = 16.5; '7-back-compact' = 20.0 }
          foreach ($name in $shots.Keys) {
            $wait = $shots[$name] - ((Get-Date) - $start).TotalSeconds
            if ($wait -gt 0) { Start-Sleep -Milliseconds ([int]($wait * 1000)) }
            Save-Island "preview-$name"
          }
          Get-Process WinIsland -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Copy-Item $log "visual/preview.log" }

      - name: Upload visual capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual
          path: visual/
          if-no-files-found: ignore

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WinIsland-win-x64
          path: src/WinIsland.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/
          if-no-files-found: error
