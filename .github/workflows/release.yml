name: Release

# Push a tag like v0.3.0 (it must match `version` in Cargo.toml), or run this workflow by hand:
# it builds the EXEs on Windows and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build the EXEs
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\make-setup.ps1 -Jobs 4

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WinIsland ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/winisland-setup.exe
            dist/winisland.exe
            dist/winisland-settings.exe
            dist/SHA256SUMS.txt
