name: Smoke test

# Builds WinIsland, starts it on a Windows desktop with a demo timer, clicks the pill, hides it
# from its right-click menu and takes screenshots; then paints the Spotify card and pill (uploaded
# as the smoke-shots artifact, together with the app's log). Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      publish_shots:
        description: Also push the screenshots to the ci-shots branch
        type: boolean
        default: false
      cleanup:
        description: Only delete the ci-shots and ci-tests branches
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  smoke:
    if: ${{ !inputs.cleanup }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile quick --bin winisland --bin winisland-settings
      - name: Run and take screenshots
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\smoke.ps1 -Exe target\quick\winisland.exe -Out shots
      - name: Paint the Spotify card and pill
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:WINISLAND_SHOTS = (Resolve-Path shots).Path
          cargo test --profile quick --lib render::card::tests::spotify_pictures -- --ignored --exact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: shots/
      - name: Push the screenshots to ci-shots
        if: ${{ always() && inputs.publish_shots }}
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q
          git checkout -q -b ci-shots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Smoke test screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-shots

  cleanup:
    if: ${{ inputs.cleanup }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete ci-shots and ci-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in ci-shots ci-tests; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" && echo "deleted $b" || echo "no $b"
          done
