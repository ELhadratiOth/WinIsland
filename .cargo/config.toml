[target.x86_64-pc-windows-msvc]
# Rust's own LLVM linker: several times faster than MSVC's link.exe.
linker = "rust-lld.exe"

# One profile for building, testing and linting: every profile keeps its own copy of every
# dependency (Slint and windows are several GB each way), so tests and clippy use quick's.
# A plain `cargo test` would bring back a second full set in debug\.
[alias]
b = "build --profile quick --bin winisland --bin winisland-settings"
t = "test --workspace --profile quick"
lint = "clippy --workspace --all-targets --profile quick"
